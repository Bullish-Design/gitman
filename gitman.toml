trunk = "main"

# Verify hook — the gate before `publish`, and before `release` by inheritance.
#
# Why it is on: `release` creates and pushes a tag, and gitman's own report says a pushed tag is
# one-way. Without a gate, tagging a red suite is one forgotten command away, and it cannot be
# cleanly undone. The gate must not depend on whoever is driving remembering to run the suite.
#
# Why it is on *now*: project 48 took the suite from ~145 s to ~21 s. A gate costing two and a
# half minutes on every publish is one people route around; at twenty seconds it is not.
# `pytest -q` picks up `-n auto` from [tool.pytest.ini_options] addopts, so this is the full
# suite in parallel.
#
# One command + args, no shell — `core.run_verify` calls `subprocess.run` directly, so
# `ruff && pytest` is not expressible here. Tests are the half that protects a tag; `ruff`
# already runs in the dev loop and in the `gitman:lint` task.
[publish]
verify = ["pytest", "-q"]
verify_timeout = 300
on_fail = "block"

# [release].verify is deliberately omitted: omitting it inherits [publish].verify, so the gate
# is configured in exactly one place. Setting it to [] here would silently disable it for the
# one verb whose mistake is hardest to reverse.

# Land gate — the test suite runs before every fold.
#
# Why it is on: project 54 finding B found that `land` ran no verify gate of its own — only
# `publish`/`release` did. Two features reached origin unverified because of that gap. `land`
# is the verb that moves trunk, so it is the one place a gate matters most.
#
# One command + args, no shell — same contract as [publish] verify; `hooks.run_hook` calls
# `subprocess.run` directly, so `ruff check src tests && pytest -q` is not expressible as one
# command. The suite is the half that protects a fold; `ruff` already runs in the dev loop and
# in the `gitman:lint` task.
#
# timeout_seconds is raised well above the 120 s default: the suite runs in ~35 s today under
# `-n auto`, but this hook holds the repo lock for its whole run, and a loaded machine can be
# far slower. 600 s gives real headroom without hiding a truly hung suite.
#
# allowed_paths covers the suite's own generated caches. Without it, every land would block:
# `pytest` rewrites `.pytest_cache/` and `__pycache__/` on every run, and the hook's
# generated-path check treats any unlisted changed path as a reason to refuse the fold.
[land.pre_hook]
command = ["pytest", "-q"]
timeout_seconds = 600.0
allowed_paths = [".pytest_cache/*", "*__pycache__/*", ".coverage*"]
