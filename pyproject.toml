[project]
name = "gitman"
version = "2.0.0"
description = "Small jj workspace helper: open and close isolated workspaces at a stable path."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" },
]

# No runtime dependencies: gitman calls the native `jj` and `git` commands from devenv.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=7.0",
  "ruff>=0.5.0",
]

[project.scripts]
gitman = "gitman.cli:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitman"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "tests",
  "examples",
  "docs",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
